# Pre-commit hooks for sop-mcp.
#
# Install once:  uv run pre-commit install
# Run manually:  uv run pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: generate-mcp-docs
        name: Regenerate docs/mcp-reference.md and llms.txt
        description: >-
          Spawns sop-mcp, introspects tools + resources, and writes the
          auto-generated docs. Triggers whenever server code or the
          generator itself changes so docs never drift from the server.
        entry: uv run python scripts/generate_docs.py
        language: system
        pass_filenames: false
        files: ^(src/sop_mcp/.*\.py|scripts/generate_docs\.py)$
